apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      # Enforce a small body cap on the fail-closed (failure_mode_allow: false)
      # ext-proc so an oversized body deterministically yields a 5xx. The
      # pre-processing ext-proc stays unbounded so routing still resolves.
      max_body_bytes: 1048576
      tls:
        mode: self_signed

    filter_chains:
      - name: ai-filters
        filters:
          - filter: anthropic_messages_to_chat_completions
          - filter: json_body
            request_extract:
              - pointer: /model
                header: X-Model-Name
            on_invalid: continue
          - filter: headers
            request_add:
              - name: X-Praxis-Processed
                value: "true"
            response_set:
              - name: X-Praxis-Version
                value: "e2e"
